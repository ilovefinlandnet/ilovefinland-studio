services:
  - type: web
    name: ilovefinland-studio
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    healthCheckPath: /api/projects
    envVars:
      - key: PORT
        value: 8787
      - key: HOST
        value: 0.0.0.0
      - key: WP_BASE_URL
        value: https://ilovefinland.net
      - key: WP_USERNAME
        sync: false
      - key: WP_APPLICATION_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
