services:
  - type: web
    name: ilovefinland-studio
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    healthCheckPath: /api/projects
    envVars:
      - key: PORT
        value: 8787
      - key: HOST
        value: 0.0.0.0
      - key: ILF_WP_BASE_URL
        sync: false
      - key: ILF_WP_USER
        sync: false
      - key: ILF_WP_APP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
